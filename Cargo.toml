[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev]
overflow-checks = true
opt-level = 2


